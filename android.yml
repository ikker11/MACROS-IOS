name: App Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generar proyecto Android con los archivos de la app
        run: bash android-build.sh

      - name: Compilar APK firmado
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/macrofit.keystore
          KEYSTORE_PASS: macrofit2026
        run: |
          gradle -p android-app assembleRelease --no-daemon --stacktrace
          cp android-app/app/build/outputs/apk/release/app-release.apk MacroFit.apk

      - name: Publicar descarga (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: MacroFit Android 1.${{ github.run_number }}
          body: Descarga **MacroFit.apk** e instálalo. Al actualizar se conservan tus datos.
          files: MacroFit.apk
          make_latest: true
